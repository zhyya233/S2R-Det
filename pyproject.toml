[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "s2r-det"
version = "0.1.0a1"
description = "S2R-Det preliminary reference implementation for supervised detector repair"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "Pillow>=10"]
[project.optional-dependencies]
tensor = ["torch>=2.1"]
evaluation = ["pycocotools>=2.0.7"]
detection = ["mmdet==3.3.0", "mmengine==0.10.7", "mmcv>=2.0.0,<2.2.0"]
test = ["pytest>=7", "torch>=2.1", "pycocotools>=2.0.7"]
[project.scripts]
s2r-det = "s2r_det.cli:main"
[tool.setuptools.packages.find]
include = ["s2r_det*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.black]
line-length = 100
