# Recorded publication environment; not tested as a fresh installation here.
# Obtain a compatible GPU toolchain/MMCV build independently. No assets download.
name: s2r-det-recorded
channels: [defaults]
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.11.0
      - torchvision==0.26.0
      - mmcv==2.1.0
      - mmengine==0.10.7
      - mmdet==3.3.0
      - numpy==2.2.6
      - pycocotools==2.0.11
      - Pillow==12.0.0
